<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="neonPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="240" r="140" fill="#818cf8" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Graduation Cap Rhombus -->
  <polygon points="256,90 420,180 256,270 92,180" fill="url(#neonPrimary)" filter="url(#glow)"/>
  <polygon points="256,115 385,180 256,245 127,180" fill="#0f172a" opacity="0.85"/>
  <polygon points="256,125 365,180 256,235 147,180" fill="none" stroke="url(#neonCyan)" stroke-width="4" opacity="0.7"/>

  <!-- Academic Node -->
  <circle cx="256" cy="180" r="16" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="256" cy="180" r="8" fill="#ffffff"/>

  <!-- Cap Skull Base -->
  <path d="M 150,225 L 150,300 C 150,350 362,350 362,300 L 362,225 C 330,245 285,258 256,258 C 227,258 182,245 150,225 Z" fill="url(#neonPrimary)" opacity="0.9"/>

  <!-- Tassel -->
  <path d="M 256,180 Q 380,200 395,280" fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="395" cy="285" r="14" fill="#fb7185" filter="url(#glow)"/>
  <path d="M 390,295 L 385,360 L 405,360 L 400,295 Z" fill="url(#neonPrimary)"/>

  <!-- Circuit Trace -->
  <path d="M 290,370 L 340,420 M 340,420 L 380,420" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="380" cy="420" r="8" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="380" cy="420" r="4" fill="#ffffff"/>
</svg>
